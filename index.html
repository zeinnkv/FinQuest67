<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ФинТрек — Финансовая грамотность</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="container header-content">
      <div class="user-profile">
        <div class="avatar">👦</div>
        <div>
          <h2 id="user-name">Пользователь</h2>
          <span class="status-badge" id="user-status">Новичок в финансах</span>
        </div>
      </div>
      <div class="balance-card">
        <span class="balance-label">Ваш баланс:</span>
        <span class="balance-amount" id="balance-amount">0 ₸</span>
      </div>
    </div>
  </header>

  <main class="container main-content">

    <section class="section">
      <h2>🎯 Задания</h2>
      <p class="section-desc">Выполняйте задания, чтобы зарабатывать монеты и прокачивать навыки!</p>
      
      <div class="cards-grid" id="tasks-container">
        </div>
    </section>

    <section class="section">
      <h2>🛍️ Магазин целей</h2>
      <p class="section-desc">Инвестируйте накопленные средства в полезные курсы и мечты!</p>
      
      <div class="cards-grid" id="shop-container">
        </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
